<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Manager</title>
	<link rel="stylesheet" href="css/dashboard.css">
	<script type="module" src="js/dashboard.js" defer></script>
</head>
<body>
	<main class="container">
		<header class="header">
			<div class="header-left">
				<div class="app-icon">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
						<circle cx="9" cy="7" r="4"></circle>
						<path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
						<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
					</svg>
				</div>
				<h1 class="title">
					Contact Manager
				</h1>
			</div>
			<div id="loggedInDiv" class="user-bar">
				<span id="userName" class="user-name"></span>
				<a
					href="admin.html"
					id="adminLinkBtn"
					class="btn btn-gold btn-small hidden"
				>
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
					</svg>
					Admin Panel
				</a>
				<button
					type="button"
					id="logoutButton"
					class="btn btn-danger btn-small"
					onclick="doLogout();"
				>
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
						<polyline points="16 17 21 12 16 7"></polyline>
						<line x1="21" y1="12" x2="9" y2="12"></line>
					</svg>
					Log Out
				</button>
			</div>
		</header>
		<section id="accessUIDiv" class="card">
			<div id="alertMessage" class="alert" role="status" aria-live="polite"></div>
			<div class="card-header">
				<h2 class="section-title">
					<span class="section-title-icon">
						<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
							<circle cx="9" cy="7" r="4"></circle>
							<path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
							<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
						</svg>
					</span>
					My Contacts
				</h2>
				<button
					type="button"
					class="btn btn-gold"
					onclick="openModal('addContactModal')"
				>
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
						<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
						<circle cx="8.5" cy="7" r="4"></circle>
						<line x1="20" y1="8" x2="20" y2="14"></line>
						<line x1="17" y1="11" x2="23" y2="11"></line>
					</svg>
					Add Contact
				</button>
			</div>
			<div class="section-card">
				<label
					for="searchText"
					class="section-label"
				>
					Search Contacts
				</label>
				<div class="input-group">
					<span class="input-icon">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="11" cy="11" r="8"></circle>
							<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
						</svg>
					</span>
					<input
						type="text"
						id="searchText"
						class="form-control"
						placeholder="Search by name or number..."
						onkeyup="searchContacts();"
					>
				</div>
			</div>
			<div class="section-card">
				<label class="section-label">
					Saved Contacts
				</label>
				<div
					id="contactList"
					class="contacts-list"
				>
				</div>
			</div>
		</section>
	</main>
	<div
		class="modal"
		id="addContactModal"
		role="dialog"
		aria-modal="true"
		aria-labelledby="addContactModalLabel"
	>
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h2
						class="modal-title"
						id="addContactModalLabel"
					>
						<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
							<circle cx="8.5" cy="7" r="4"></circle>
							<line x1="20" y1="8" x2="20" y2="14"></line>
							<line x1="17" y1="11" x2="23" y2="11"></line>
						</svg>
						Add Contact
					</h2>
					<button
						type="button"
						class="modal-close"
						aria-label="Close"
						onclick="closeModal('addContactModal')"
					>
						×
					</button>
				</div>
				<div class="modal-body">
					<div class="form-group">
						<label
							for="contactFirstNameInput"
							class="form-label"
						>
							First Name
						</label>
						<input
							type="text"
							id="contactFirstNameInput"
							class="form-control"
							placeholder="Enter first name"
							required
						>
					</div>
					<div class="form-group">
						<label
							for="contactLastNameInput"
							class="form-label"
						>
							Last Name
						</label>
						<input
							type="text"
							id="contactLastNameInput"
							class="form-control"
							placeholder="Enter last name"
							required
						>
					</div>
					<div class="form-group">
						<label
							for="contactEmailInput"
							class="form-label"
						>
							Email
						</label>
						<input
							type="email"
							id="contactEmailInput"
							class="form-control"
							placeholder="Enter email address"
							required
						>
					</div>
					<div class="form-group">
						<label
							for="contactPhoneInput"
							class="form-label"
						>
							Phone Number
						</label>
						<input
							type="text"
							id="contactPhoneInput"
							class="form-control"
							placeholder="Enter phone number"
						>
					</div>
					<div
						id="addContactMsg"
						class="error-message"
					></div>
				</div>
				<div class="modal-footer">
					<button
						type="button"
						class="btn btn-outline-gold"
						onclick="closeModal('addContactModal')"
					>
						Cancel
					</button>
					<button
						type="button"
						class="btn btn-gold"
						onclick="addContactMock();"
					>
						Save Contact
					</button>
				</div>
			</div>
		</div>
	</div>
	<div
		class="modal"
		id="editContactModal"
		role="dialog"
		aria-modal="true"
		aria-labelledby="editContactModalLabel"
	>
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h2
						class="modal-title"
						id="editContactModalLabel"
					>
						Edit Contact
					</h2>
					<button
						type="button"
						class="modal-close"
						aria-label="Close"
						onclick="closeModal('editContactModal')"
					>
						×
					</button>
				</div>
				<div class="modal-body">
					<div class="form-group">
						<label for="editFirstNameInput" class="form-label">First Name</label>
						<input type="text" id="editFirstNameInput" class="form-control" required>
					</div>
					<div class="form-group">
						<label for="editLastNameInput" class="form-label">Last Name</label>
						<input type="text" id="editLastNameInput" class="form-control" required>
					</div>
					<div class="form-group">
						<label for="editEmailInput" class="form-label">Email</label>
						<input type="email" id="editEmailInput" class="form-control" required>
					</div>
					<div class="form-group">
						<label for="editPhoneInput" class="form-label">Phone Number</label>
						<input type="text" id="editPhoneInput" class="form-control" required>
					</div>
					<div id="editContactMsg" class="error-message"></div>
				</div>
				<div class="modal-footer">
					<button
						type="button"
						class="btn btn-outline-gold"
						onclick="closeModal('editContactModal')"
					>
						Cancel
					</button>
					<button
						type="button"
						class="btn btn-gold"
						onclick="saveEditedContact();"
					>
						Save Changes
					</button>
				</div>
			</div>
		</div>
	</div>
	<div
		class="modal"
		id="deleteConfirmModal"
		role="dialog"
		aria-modal="true"
		aria-labelledby="deleteConfirmModalLabel"
	>
		<div class="modal-dialog modal-dialog-small">
			<div class="modal-content">
				<div class="modal-header">
					<h2
						class="modal-title"
						id="deleteConfirmModalLabel"
					>
						<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d9534f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
							<circle cx="8.5" cy="7" r="4"></circle>
							<line x1="18" y1="8" x2="23" y2="13"></line>
							<line x1="23" y1="8" x2="18" y2="13"></line>
						</svg>
						Delete Contact
					</h2>
					<button
						type="button"
						class="modal-close"
						aria-label="Close"
						onclick="closeModal('deleteConfirmModal')"
					>
						×
					</button>
				</div>
				<div class="modal-body">
					<p class="delete-message">
						Are you sure you want to delete
						<strong id="deleteTargetName"></strong>?
					</p>
					<span class="delete-warning">
						This action cannot be undone.
					</span>
				</div>
				<div class="modal-footer">
					<button
						type="button"
						class="btn btn-outline-gold btn-small"
						onclick="closeModal('deleteConfirmModal')"
					>
						Cancel
					</button>
					<button
						type="button"
						class="btn btn-danger btn-small"
						onclick="confirmDeleteContact();"
					>
						Delete
					</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
