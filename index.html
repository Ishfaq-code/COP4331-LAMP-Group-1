<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager</title>
  <link rel="stylesheet" href="css/login.css" />
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <div class="login-card">
    <img src="public/logo.png" alt="Knight Contact Manager Logo" class="login-logo">
    <h2>Knight Contact Manager Login</h2>
    <p class="subtitle">Log in to access your UCF Professor Contact Manager</p>
    <p class="subtitle">Please enter your credentials to log in</p>

    <div id="alertMessage" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">Username</label>
        <input 
          type="text" 
          id="login" 
          name="login" 
          placeholder="Enter your Username!" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your Password!" 
          minlength="8" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-submit">Log In</button>
          <p class="register-link">
      Don't have an account? <a href="register.html">Register</a>
    </p>
    </form>
  </div>
</body>
</html>
