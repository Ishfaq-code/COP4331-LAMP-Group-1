<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up or Log In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0a0a0a; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #ffffff;
    }

    .register-card {
      background: #141414; 
      padding: 50px 40px;
      border-radius: 12px;
      border-top: 4px solid #D4AF37; 
      border-bottom: 4px solid #D4AF37;
      border-left: 4px solid #D4AF37;
      border-right: 4px solid #D4AF37;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      width: 100%;
      max-width: 600px;
      text-align: center; 
    }

    .register-card h1 {
      margin-bottom: 40px;
      color: #D4AF37; 
      font-size: 32px;
      letter-spacing: 0.5px;
    }

    .auth-section {
      margin-bottom: 25px;
    }

    .auth-section h2 {
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
    }

    .auth-section p.subtitle {
      color: #888888;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #D4AF37; 
      color: #000000;
      border: 2px solid #D4AF37;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #F3C623; /* Brighter gold on hover */
      border-color: #F3C623;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .btn-outline {
      width: 100%;
      padding: 14px;
      background-color: transparent;
      color: #D4AF37;
      border: 2px solid #D4AF37;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline:hover {
      background-color: #D4AF37;
      color: #000000;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 30px 0;
      color: #555555;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before, 
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #333333;
    }

    .divider span {
      padding: 0 15px;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <h1>Welcome to Contact Manager!</h1>

    <div class="auth-section">
        <h2>Register for a New Account</h2>
        <p class="subtitle">Sign up for a new account to get started.</p>

        <button type="button" class="btn-submit" onclick="location.href='register.html'">Sign Up</button>
    </div>

    <div class="divider">
      <span>OR</span>
    </div>

    <div class="auth-section">
      <h2>Already have an account?</h2>
      <p class="subtitle">Log in to your existing account.</p>
      
      <button type="button" class="btn-outline" onclick="location.href='login.html'">Log In</button>
    </div>
  </div>

</body>
</html>
