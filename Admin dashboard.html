<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="py-4 py-md-5">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10">

                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle">
                    <h1 class="h3 fw-bold text-white mb-0"><i class="bi bi-shield-lock-fill text-warning me-2"></i>Admin Dashboard</h1>
                    <a href="color.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Contacts
                    </a>
                </div>

                <!-- Admin Action Panels -->
                <div class="row g-4">
                    <!-- Suspend User / Admin -->
                    <div class="col-md-6">
                        <div class="card glass-card p-4 border h-100">
                            <h5 class="text-white mb-3"><i class="bi bi-person-x-fill text-danger me-2"></i>Suspend Account</h5>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Username or User ID</label>
                                <input type="text" id="suspendUsername" class="form-control" placeholder="Enter user or admin name">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="isAdminCheck">
                                <label class="form-check-label text-white small" for="isAdminCheck">Target is an Admin</label>
                            </div>
                            <button class="btn btn-danger w-100 rounded-pill" onclick="alert('Suspend endpoint pending integration.');">
                                Suspend Account
                            </button>
                        </div>
                    </div>

                    <!-- Password Reset -->
                    <div class="col-md-6">
                        <div class="card glass-card p-4 border h-100">
                            <h5 class="text-white mb-3"><i class="bi bi-key-fill text-warning me-2"></i>Reset User Password</h5>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Target Username</label>
                                <input type="text" id="resetUsername" class="form-control" placeholder="Enter username">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">New Password</label>
                                <input type="password" id="newPasswordInput" class="form-control" placeholder="Enter new password">
                            </div>
                            <button class="btn btn-warning w-100 rounded-pill fw-semibold" onclick="alert('Password reset endpoint pending integration.');">
                                Update Password
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
