<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000080;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #333333;
    }

    .login-card p.subtitle {
      text-align: center;
      color: #666666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #444444;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0066ff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #0052cc;
    }

    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 14px;
      display: none;
    }

    .alert-error {
      background-color: #ffe6e6;
      color: #cc0000;
      border: 1px solid #ffcccc;
    }

    .alert-success {
      background-color: #e6ffe6;
      color: #008000;
      border: 1px solid #ccffcc;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to access your contacts</p>
    <p class="subtitle">Please enter your credentials to log in</p>

    <div id="alertMessage" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">Username / Login</label>
        <input 
          type="text" 
          id="login" 
          name="login" 
          placeholder="MisterJohn" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Password!" 
          minlength="8" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const alertBox = document.getElementById('alertMessage');
      alertBox.style.display = 'none';

      const loginInput = document.getElementById('login').value.trim();
      const passwordInput = document.getElementById('password').value;

      // Validate password format: >=8 chars, at least 1 number, at least 1 symbol
      const hasMinLength = passwordInput.length >= 8;
  

      if (!hasMinLength || !hasNumber || !hasSymbol) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = 'Password must be at least 8 characters long';
        alertBox.style.display = 'block';
        return;
      }

      const payload = {
        login: loginInput,
        password: passwordInput
      };

      try {
        // Points directly to your existing PHP login file
        const response = await fetch('api/login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = data.message || 'Successfully logged in!';
          alertBox.style.display = 'block';

          // Store returned user session data
          if (data.data) {
            localStorage.setItem('user', JSON.stringify(data.data));
          }

          // Redirect to the dashboard
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          // Display backend error message in the alert box
          alertBox.className = 'alert alert-error';
          alertBox.textContent = data.message || 'Login failed.';
          alertBox.style.display = 'block';
        }
      } catch (error) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = 'Network error or server unavailable.';
        alertBox.style.display = 'block';
      }
    });
  </script>

</body>
</html>
