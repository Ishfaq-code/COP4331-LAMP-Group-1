<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/admin.css" rel="stylesheet">
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body>
    <main class="container">
        <!-- Dashboard Header -->
        <div class="header">
            <div class="header-left">
                <div class="app-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h1 class="title">Admin Dashboard</h1>
            </div>
            <a href="color.html" class="btn btn-outline-gold">
                <i class="bi bi-arrow-left"></i> Back to Contacts
            </a>
        </div>

        <!-- Admin Action Panels -->
        <div class="admin-grid">
            <!-- Suspend User / Admin -->
            <div class="card">
                <h2 class="card-title">
                    <i class="bi bi-person-x-fill text-danger"></i> Suspend Account
                </h2>
                <div class="form-group">
                    <label class="form-label" for="suspendUsername">Username or User ID</label>
                    <input type="text" id="suspendUsername" class="form-control" placeholder="Enter user or admin name">
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="isAdminCheck">
                    <label class="form-check-label" for="isAdminCheck">Target is an Admin</label>
                </div>
                <button class="btn btn-danger btn-full" onclick="alert('Suspend endpoint pending integration.');">
                    Suspend Account
                </button>
            </div>

            <!-- Password Reset -->
            <div class="card">
                <h2 class="card-title">
                    <i class="bi bi-key-fill text-gold"></i> Reset User Password
                </h2>
                <div class="form-group">
                    <label class="form-label" for="resetUsername">Target Username</label>
                    <input type="text" id="resetUsername" class="form-control" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="newPasswordInput">New Password</label>
                    <input type="password" id="newPasswordInput" class="form-control" placeholder="Enter new password">
                </div>
                <button class="btn btn-gold btn-full" onclick="alert('Password reset endpoint pending integration.');">
                    Update Password
                </button>
            </div>
        </div>
    </main>
</body>
</html>
